[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweaver"
version = "0.1.0"
description = "Zero-Dependency P2P Async Task Broker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Vishesh Hembrom" }
]
keywords = ["p2p", "distributed-systems", "asyncio", "task-broker", "kademlia", "peer-to-peer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
metrics = [
    "psutil>=5.9.0",
]
security = [
    "cryptography>=42.0.0",
]
cli = [
    "rich>=13.0.0",
]
all = [
    "psutil>=5.9.0",
    "cryptography>=42.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/vishesh-hembrom/meshweaver-p2p-async-task-broker"
Documentation = "https://github.com/vishesh-hembrom/meshweaver-p2p-async-task-broker#readme"
Repository = "https://github.com/vishesh-hembrom/meshweaver-p2p-async-task-broker.git"
"Issue Tracker" = "https://github.com/vishesh-hembrom/meshweaver-p2p-async-task-broker/issues"

[project.scripts]
meshweaver = "meshweaver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
